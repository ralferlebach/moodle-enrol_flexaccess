name: Main ecosystem (cross-plugin + jmeter + playwright)

# Runs on integration into main: the full FlexAccess ecosystem (all four plugins together),
# followed by real load (JMeter) and browser (Playwright) tests against a live site.
# The fast per-plugin static/unit pipeline lives in moodle-ci.yml and runs on every branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOODLE_BRANCH: MOODLE_405_STABLE
  MOODLE_WWWROOT: http://localhost:8000
  ADMIN_PASS: 'Admin!23'
  JMETER_VERSION: '5.6.3'
  JMETER_SHA512: 'a2a5b7cf6f7e2d7b1c9f... (pin the published checksum before enabling)'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cross-plugin PHPUnit + Behat + coding standards for the whole ecosystem.
  # ---------------------------------------------------------------------------
  ecosystem:
    name: "Ecosystem PHPUnit + Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
          coverage: pcov
      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Check out sibling FlexAccess plugins (ecosystem dependencies)
        run: |
          mkdir -p "$HOME/extra-plugins"
          for sib in auth mod tool; do
            git clone --depth 1 --branch main \
              "https://github.com/ralferlebach/moodle-${sib}_flexaccess.git" \
              "$HOME/extra-plugins/${sib}_flexaccess" \
              || git clone --depth 1 \
              "https://github.com/ralferlebach/moodle-${sib}_flexaccess.git" \
              "$HOME/extra-plugins/${sib}_flexaccess"
          done
      - name: Install Moodle and the ecosystem
        run: |
          moodle-plugin-ci install --plugin ./plugin --extra-plugins "$HOME/extra-plugins" \
            --branch ${{ matrix.moodle }} \
            --db-type pgsql --db-host 127.0.0.1 --db-port 5432 \
            --db-user moodle --db-pass moodle --db-name moodle
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Coding standards (all four plugins)
        run: |
          moodle-plugin-ci phpcs --max-warnings 0
          moodle-plugin-ci phpcs "$HOME/extra-plugins/auth_flexaccess" --max-warnings 0
          moodle-plugin-ci phpcs "$HOME/extra-plugins/mod_flexaccess"  --max-warnings 0
          moodle-plugin-ci phpcs "$HOME/extra-plugins/tool_flexaccess" --max-warnings 0
      - name: PHPUnit (enrol + siblings) with coverage gate
        run: |
          moodle-plugin-ci phpunit --coverage-text --coverage-pcov | tee /tmp/phpunit-cov.txt
          pct=$(grep -Eo 'Lines:[[:space:]]+[0-9.]+%' /tmp/phpunit-cov.txt | head -1 | grep -Eo '[0-9.]+' | head -1)
          echo "Measured line coverage: ${pct:-unknown}%"
          # Conservative floor guarding against coverage collapse. Raise after reviewing the first
          # measured run (see docs/coverage.md).
          floor=25
          awk -v p="${pct:-0}" -v f="$floor" 'BEGIN { exit (p+0 >= f+0) ? 0 : 1 }' \
            || { echo "::error::Line coverage ${pct}% is below the required floor ${floor}%"; exit 1; }
      - name: Behat ecosystem journeys
        run: moodle-plugin-ci behat --profile chrome --tags "@flexaccess_ecosystem" --start-servers

  # ---------------------------------------------------------------------------
  # 2. Real browser journeys (Playwright) against a live, installed site.
  # ---------------------------------------------------------------------------
  playwright:
    name: Playwright (live site)
    runs-on: ubuntu-latest
    needs: ecosystem
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out Moodle and the ecosystem
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle
          cp -a plugin moodle/enrol/flexaccess && rm -rf moodle/enrol/flexaccess/.git
          for pair in "auth:auth" "mod:mod" "tool:admin/tool"; do
            sib="${pair%%:*}"; dest="${pair##*:}"
            git clone --depth 1 --branch main \
              "https://github.com/ralferlebach/moodle-${sib}_flexaccess.git" "/tmp/${sib}" \
              || git clone --depth 1 \
              "https://github.com/ralferlebach/moodle-${sib}_flexaccess.git" "/tmp/${sib}"
            mkdir -p "moodle/${dest}" && cp -a "/tmp/${sib}" "moodle/${dest}/flexaccess"
            rm -rf "moodle/${dest}/flexaccess/.git"
          done
      - name: Install Moodle site
        run: |
          cd moodle
          mkdir -p /tmp/moodledata
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="$ADMIN_PASS" --adminemail=ci@example.invalid
      - name: Start Moodle web server
        run: |
          cd moodle
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8000 -t . >/tmp/moodle-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://localhost:8000/login/index.php || true)
            [ "$code" = "200" ] && { echo "server ready"; exit 0; }
            sleep 3
          done
          echo "Moodle did not become ready:"; tail -50 /tmp/moodle-server.log; exit 1
      - name: Seed FlexAccess course fixture
        run: |
          cd moodle
          php enrol/flexaccess/tests/playwright/seed.php > /tmp/seed.env
          sed -n "s/^export \([A-Z_][A-Z_]*\)='\(.*\)'$/\1=\2/p" /tmp/seed.env >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          cd moodle/enrol/flexaccess/tests/playwright
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          FLEXACCESS_ADMIN_PASS: ${{ env.ADMIN_PASS }}
        run: |
          cd moodle/enrol/flexaccess/tests/playwright
          npm test
      - name: Show server log on failure
        if: failure()
        run: tail -100 /tmp/moodle-server.log || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            moodle/enrol/flexaccess/tests/playwright/playwright-report
            moodle/enrol/flexaccess/tests/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Real load test (JMeter) against the FlexAccess entry endpoints.
  # ---------------------------------------------------------------------------
  jmeter:
    name: JMeter (live site)
    runs-on: ubuntu-latest
    needs: ecosystem
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out Moodle and install the plugin
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle
          cp -a plugin moodle/enrol/flexaccess && rm -rf moodle/enrol/flexaccess/.git
      - name: Install Moodle site
        run: |
          cd moodle
          mkdir -p /tmp/moodledata
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="$ADMIN_PASS" --adminemail=ci@example.invalid
      - name: Start Moodle web server
        run: |
          cd moodle
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8000 -t . >/tmp/moodle-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://localhost:8000/login/index.php || true)
            [ "$code" = "200" ] && { echo "server ready"; exit 0; }
            sleep 3
          done
          echo "Moodle did not become ready:"; tail -50 /tmp/moodle-server.log; exit 1
      - name: Create FlexAccess course fixture
        id: fixture
        run: |
          cd moodle
          COURSE_ID=$(php enrol/flexaccess/tests/fixtures/setup_load_course.php | tail -1)
          echo "courseid=$COURSE_ID" >> "$GITHUB_OUTPUT"
      - name: Set up JMeter (checksum-verified)
        run: |
          base="https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}"
          curl -sSL "${base}.tgz" -o jmeter.tgz
          # Supply-chain: verify the archive against Apache's published SHA-512 before trusting it.
          # A pinned JMETER_SHA512 (a full 128-hex digest) takes precedence; otherwise the official
          # published checksum file is used. The build fails on any mismatch.
          if printf '%s' "${JMETER_SHA512}" | grep -Eq '^[0-9a-fA-F]{128}$'; then
            echo "${JMETER_SHA512}  jmeter.tgz" | sha512sum -c -
          else
            curl -sSL "${base}.tgz.sha512" -o jmeter.tgz.sha512
            echo "$(cut -d' ' -f1 jmeter.tgz.sha512)  jmeter.tgz" | sha512sum -c -
          fi
          tar xzf jmeter.tgz
      - name: Run JMeter against FlexAccess endpoints
        run: |
          apache-jmeter-${JMETER_VERSION}/bin/jmeter -n \
            -t plugin/tests/load/flexaccess-read-endpoints.jmx \
            -Jbase_url="$MOODLE_WWWROOT" \
            -Jcourseid='${{ steps.fixture.outputs.courseid }}' \
            -Jthreads=25 -Jrampup=10 -Jduration=60 -Jmaxlatency=5000 \
            -l /tmp/jmeter-results.jtl -j /tmp/jmeter.log
      - name: Fail on JMeter errors
        run: |
          # Column 8 of the JTL is "success" (true/false). Any false fails the job.
          if grep -q ',false,' /tmp/jmeter-results.jtl; then
            echo "JMeter reported sample failures:"
            grep ',false,' /tmp/jmeter-results.jtl | head -20
            exit 1
          fi
          echo "All JMeter samples succeeded."
      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: |
            /tmp/jmeter-results.jtl
            /tmp/jmeter.log
          retention-days: 7
          if-no-files-found: ignore
